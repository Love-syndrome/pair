<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone Theme Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f5;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#202127}.layout{max-width:1100px;margin:auto;display:grid;grid-template-columns:350px 1fr;gap:24px;padding:24px}.editor{background:white;border:1px solid #e3e3e8;border-radius:22px;padding:22px;align-self:start}.editor h1{font-size:22px;margin:0 0 5px}.muted{font-size:12px;color:#85858e;line-height:1.6}.group{border-top:1px solid #eee;padding-top:15px;margin-top:16px}.group h2{font-size:13px;margin:0 0 10px}label{font-size:12px;display:block;margin:9px 0 5px;color:#656571}input,textarea,select{width:100%;border:1px solid #dddde5;border-radius:10px;background:#fafafa;padding:10px;font:inherit;font-size:13px}textarea{min-height:100px;resize:vertical}button{cursor:pointer;border:0;border-radius:11px;padding:10px 13px;background:#eaeaf0;color:#26262c;font-weight:600}.primary{background:#24242a;color:white}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview{display:flex;flex-direction:column;align-items:center;gap:12px}.phone{width:350px;height:720px;border:8px solid #17171a;border-radius:52px;background:#000;position:relative;overflow:hidden;box-shadow:0 22px 65px #0003}.screen{position:absolute;inset:0;background:linear-gradient(155deg,#485c83,#151b32 65%,#594c71);background-position:center;background-size:cover;color:white;overflow:hidden}.shade{position:absolute;inset:0;background:linear-gradient(#0003,transparent 35%,#0004);pointer-events:none}.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:29px;background:#070709;border-radius:30px;z-index:12}.status{position:absolute;top:17px;left:27px;right:26px;display:flex;justify-content:space-between;z-index:11;font-size:14px;font-weight:700}.status span:last-child{letter-spacing:1px}.page{position:absolute;inset:0;padding-top:58px;padding-bottom:25px;overflow:auto;scrollbar-width:none}.page::-webkit-scrollbar{display:none}.lock{text-align:center;padding-top:78px}.lock .date{font-size:19px}.lock .clock{font-size:76px;font-weight:200;letter-spacing:-4px;line-height:1.15}.lock .notice{margin:60px 18px 0;padding:14px;background:#ffffff35;backdrop-filter:blur(20px);border-radius:17px;text-align:left;font-size:13px}.unlock{position:absolute;bottom:43px;left:0;right:0;text-align:center;font-size:13px}.home{padding:35px 20px 0}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 13px}.app{text-align:center;font-size:11px;text-shadow:0 1px 3px #0006}.app button{width:57px;height:57px;padding:0;border-radius:15px;font-size:28px;background:#ffffffdf;box-shadow:0 2px 12px #0002;margin-bottom:5px}.dock{position:absolute;bottom:34px;left:18px;right:18px;border-radius:24px;background:#ffffff4d;backdrop-filter:blur(18px);display:flex;justify-content:space-evenly;padding:12px}.dock button{width:53px;height:53px;font-size:26px;background:#fff;border-radius:15px;padding:0}.appview{background:#fff;color:#16161a;height:100%;padding-top:4px}.appview.dark{background:#111115;color:#f8f8fa}.nav{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #8882}.nav button{padding:5px;background:transparent;color:#087cff;font-weight:500}.nav strong{font-size:16px}.listrow{padding:14px 19px;border-bottom:1px solid #8882;display:flex;gap:12px;align-items:center;font-size:14px;cursor:pointer}.avatar{width:43px;height:43px;border-radius:50%;background:#a6a6b1;display:grid;place-items:center;color:#fff;flex-shrink:0;background-size:cover;background-position:center}.sub{color:#90909a;font-size:11px;margin-top:5px}.messages{padding:15px 14px 90px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:82%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere}.incoming{align-self:flex-start;background:#e9e9ee;color:#17171b;border-bottom-left-radius:5px}.outgoing{align-self:flex-end;background:#087 .editor{max-height:calc(100vh - 40px);overflow:auto}.phone.legacy{border-radius:38px;border:7px solid #ddd9d5;box-shadow:inset 0 0 0 2px #aaa,0 22px 65px #0003;background:#eee;height:720px}.phone.legacy .screen{inset:53px 0 60px;border-radius:1px}.phone.legacy .island{display:none}.phone.legacy .status{top:8px;left:9px;right:9px;font-size:11px}.phone.legacy .page{padding-top:28px}.phone.legacy:before{content:'';position:absolute;top:22px;left:50%;transform:translateX(-50%);width:48px;height:5px;border-radius:10px;background:#aaa}.phone.legacy:after{content:'';position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:41px;height:41px;border:2px solid #bcb8b4;border-radius:50%;background:#f5f4f3}.phone.legacy .homebar{display:none}.phone.legacy .lock{padding-top:45px}.phone.legacy .lock .clock{font-weight:200;font-size:65px}.phone.legacy .home{padding-top:24px}.phone.legacy .app button,.phone.legacy .dock button{border-radius:13px}.phone.legacy .dock{bottom:12px}.phone.legacy .composer{bottom:10px}.phone.legacy .messages{padding-bottom:85px}

</style></head><body><div class="layout"><aside class="editor"><h1>iPhone Theme Studio</h1><div class="muted">사진과 대화, 잠금화면을 편집하는 개인용 아이폰 테마 스튜디오</div><div class="group"><h2>기종 · 내보내기</h2><label>아이폰 모델</label><select id="deviceInput"><option value="modern">최신 아이폰 · Dynamic Island</option><option value="legacy">iPhone 6s · 홈 버튼</option></select><label class="export-options"><input type="checkbox" id="transparentInput"> 아이폰 바깥 배경 투명화</label><div class="buttons"><button id="exportBtn" class="primary">PNG 사진 저장 · 랜덤 파일명</button></div><p class="muted" id="exportStatus">아이폰 전체를 이미지로 저장합니다.</p></div><div class="group"><h2>배경화면</h2><label>잠금화면 사진</label><input type="file" id="lockUpload" accept="image/*" class="file"><label>홈 화면 사진</label><input type="file" id="homeUpload" accept="image/*" class="file"><label>시계 표시 시간</label><input id="clockInput" value="09:41"><label>잠금화면 알림</label><input id="noticeInput" value="새로운 메시지가 도착했습니다."></div><div class="group"><h2>메시지 편집</h2><label>상대방 이름</label><input id="contactInput" value="신드롬"><label>프로필 사진</label><input type="file" id="avatarUpload" accept="image/*" class="file"><p class="muted">메시지를 개별 추가하고 왼쪽/오른쪽을 지정하세요. 순서도 바꿀 수 있습니다.</p><div id="messageEditor"></div><div class="buttons"><button id="addLeft">+ 왼쪽 메시지</button><button id="addRight">+ 오른쪽 메시지</button></div><label>빠른 텍스트 입력 (선택)</label><textarea id="chatInput" placeholder="상대: 안녕\n나: 반가워"></textarea><button id="applyChat">텍스트 대화 불러오기</button></div><div class="group"><h2>알림 · 전화 · 음악</h2><label>알림 목록 (한 줄당 하나)</label><textarea id="alertsInput">메시지 | 신드롬 | 지금 어디야?
캘린더 | 오늘의 일정 | 오후 7시 약속</textarea><label>최근 통화 (한 줄당 하나)</label><textarea id="callsInput">신드롬 | 부재중 | 오후 8:41
신드롬 | 수신 | 어제</textarea><label>음악 제목</label><input id="songInput" value="Our Song"><label>아티스트</label><input id="artistInput" value="Syndrome"><label>앨범 커버 사진</label><input type="file" id="coverUpload" accept="image/*" class="file"></div><div class="group"><h2>사진 · 메모 · 외관</h2><label>사진 앱에 추가할 이미지 (여러 장 가능)</label><input type="file" id="photosUpload" accept="image/*" multiple class="file"><label>메모 내용</label><textarea id="noteInput">잊지 말 것.

우리의 기념일, 그리고 오늘의 약속.</textarea><label>화면 테마</label><select id="modeInput"><option value="light">라이트 모드</option><option value="dark">다크 모드</option></select><div class="buttons"><button id="saveBtn" class="primary">설정 저장</button><button id="resetBtn">초기화</button></div><p class="muted">설정은 이 브라우저에 저장됩니다. 업로드 사진은 파일 크기와 브라우저 저장 용량에 따라 저장되지 않을 수 있습니다.</p></div></aside><main class="preview"><div class="phone" id="phone"><div class="screen" id="screen"><div class="shade" id="shade"></div><div class="island"></div><div class="status"><span id="statusClock">9:41</span><span>●●● ▰</span></div><div id="page" class="page"></div><div class="homebar" id="homebar" title="홈 화면으로 돌아가기"></div></div></div><div class="previewhelp">잠금화면을 탭해 해제 · 앱 아이콘을 눌러 실행 · 아래 막대를 눌러 홈으로</div><div class="buttons"><button id="lockBtn">잠금화면</button><button id="homeBtn">홈 화면</button><button id="messageBtn">메시지</button><button id="alertsBtn">알림</button><button id="musicBtn">음악</button></div></main></div><script>
const $=id=>document.getElementById(id);let state={page:'lock',lockImg:'',homeImg:'',avatar:'',photos:[],selectedPhoto:-1,contact:'신드롬',chat:[],note:'',mode:'light',clock:'09:41',notice:'',device:'modern',transparent:false,alerts:'',calls:'',song:'Our Song',artist:'Syndrome',cover:'',playing:false};const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const readFile=file=>new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});function parseChat(v){return v.split('\n').filter(x=>x.trim()).map(x=>({side:/^(나|me):/i.test(x)?'out':'in',text:x.replace(/^(상대|나|me):\s*/i,'')}))}function setPage(p){state.page=p;render()}function render(){const p=state.page,wall=p==='lock'?state.lockImg:state.homeImg;$('phone').classList.toggle('legacy',state.device==='legacy');$('screen').style.backgroundImage=wall?`url("${wall}")`:'linear-gradient(155deg,#485c83,#151b32 65%,#594c71)';$('shade').style.display=['lock','home'].includes(p)?'block':'none';$('statusClock').textContent=state.clock;$('statusClock').style.color=['lock','home'].includes(p)?'white':state.mode==='dark'?'white':'black';$('homebar').className='homebar'+(!['lock','home'].includes(p)&&state.mode==='light'?' lightbar':'');let out='';if(p==='lock'){out=`<div class="lock" id="unlock"><div class="date">${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}</div><div class="clock">${escapeHTML(state.clock)}</div>${(state.notice||state.alerts)?`<div class="notice-stack">${(state.alerts||('메시지 | '+state.contact+' | '+state.notice)).split('\n').filter(Boolean).slice(0,3).map(a=>{let z=a.split('|');return `<div class="notice"><b>${escapeHTML(z[0]||'알림')} · ${escapeHTML(z[1]||'')}</b><br>${escapeHTML(z.slice(2).join('|')||state.notice)}</div>`}).join('')}</div>`:''}</div><div class="unlock">위로 쓸어올리거나 터치해서 잠금 해제 ⌃</div>`}else if(p==='home'){out=`<div class="home"><div class="apps">${[['messages','💬','메시지'],['alerts','🔔','알림'],['music','🎵','음악'],['photos','🌄','사진'],['notes','📝','메모'],['settings','⚙️','설정'],['calls','📞','전화'],['calendar','📅','캘린더']].map(a=>`<div class="app"><button data-page="${a[0]}">${a[1]}</button><div>${a[2]}</div></div>`).join('')}</div></div><div class="dock"><button data-page="calls">📞</button><button data-page="messages">💬</button><button data-page="photos">🌄</button><button data-page="settings">⚙️</button></div>`}else{const dark=state.mode==='dark'?' dark':'';let inner='';if(p==='messages'){inner=`<div class="nav"><button data-page="home">‹ 뒤로</button><strong>메시지</strong><span>•••</span></div><div class="listrow" data-page="thread"><div class="avatar" style="${state.avatar?`background-image:url('${state.avatar}')`:''}">${state.avatar?'':'👤'}</div><div><b>${escapeHTML(state.contact)}</b><div class="sub">${escapeHTML(state.chat.at(-1)?.text||'대화를 시작하세요')}</div></div></div>`}if(p==='thread'){inner=`<div class="nav"><button data-page="messages">‹ 목록</button><strong>${escapeHTML(state.contact)}</strong><span>◯</span></div><div class="messages">${state.chat.map(m=>`<div class="bubble ${m.side==='out'?'outgoing':'incoming'}">${escapeHTML(m.text)}</div>`).join('')}</div><div class="composer"><input id="newMessage" placeholder="메시지 입력"><button id="sendMessage">↑</button></div>`}if(p==='photos'){inner=`<div class="nav"><button data-page="home">‹ 홈</button><strong>사진</strong><span>${state.photos.length}장</span></div>${state.selectedPhoto>=0?`<div class="notes"><button data-action="gallery">‹ 앨범</button><img class="photo-large" src="${state.photos[state.selectedPhoto]}"></div>`:`<div class="photo-grid">${state.photos.map((src,i)=>`<img src="${src}" data-photo="${i}">`).join('')}</div>`}`}if(p==='notes')inner=`<div class="nav"><button data-page="home">‹ 홈</button><strong>메모</strong><span>•••</span></div><div class="notes">${escapeHTML(state.note)}</div>`;if(p==='settings')inner=`<div class="nav"><button data-page="home">‹ 홈</button><strong>설정</strong><span>⚙</span></div><div class="settingsrow">배경화면 — 왼쪽 편집기에서 변경</div><div class="settingsrow">디스플레이 — ${state.mode==='dark'?'다크':'라이트'} 모드</div><div class="settingsrow">사용자 정의 테마</div>`;if(p==='alerts')inner=`<div class="nav"><button data-page="home">‹ 홈</button><strong>알림 센터</strong><span>🔔</span></div>${state.alerts.split('\n').filter(Boolean).map(a=>{let z=a.split('|');return `<div class="alert-item"><b>${escapeHTML(z[0]||'알림')} · ${escapeHTML(z[1]||'')}</b><div style="margin-top:5px">${escapeHTML(z.slice(2).join('|'))}</div></div>`}).join('')}`;
if(p==='music')inner=`<div class="nav"><button data-page="home">‹ 홈</button><strong>음악</strong><span>♫</span></div>${state.cover?`<img class="music-cover" src="${state.cover}">`:'<div class="music-fallback">♫</div>'}<div class="music-info"><b>${escapeHTML(state.song)}</b><div class="sub">${escapeHTML(state.artist)}</div></div><div class="music-progress"></div><div class="music-controls"><button data-action="previous">⏮</button><button data-action="play">${state.playing?'⏸':'▶'}</button><button data-action="next">⏭</button></div><p class="muted" style="text-align:center">음악 재생 화면 시뮬레이션</p>`;
if(p==='calls')inner=`<div class="nav"><button data-page="home">‹ 홈</button><strong>최근 통화</strong><span>+</span></div>${state.calls.split('\n').filter(Boolean).map(a=>{let z=a.split('|');return `<div class="listrow">📞 <div><b>${escapeHTML(z[0]||'알 수 없음')}</b><div class="sub">${escapeHTML(z[1]||'')}</div></div><span class="sub" style="margin-left:auto">${escapeHTML(z[2]||'')}</span></div>`}).join('')}`;if(p==='calendar')inner=`<div class="nav"><button data-page="home">‹ 홈</button><strong>캘린더</strong><span>+</span></div><div class="notes">${new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'})}<br><br>오늘의 일정이 없습니다.</div>`;out=`<div class="appview${dark}">${inner}</div>`}$('page').innerHTML=out;$('page').querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{if(el.dataset.page==='photos')state.selectedPhoto=-1;setPage(el.dataset.page)});if(p==='lock')$('page').onclick=()=>setPage('home');$('page').querySelectorAll('[data-action=play]').forEach(el=>el.onclick=()=>{state.playing=!state.playing;render()});$('page').querySelectorAll('[data-photo]').forEach(el=>el.onclick=()=>{state.selectedPhoto=+el.dataset.photo;render()});$('page').querySelectorAll('[data-action="gallery"]').forEach(el=>el.onclick=()=>{state.selectedPhoto=-1;render()});if($('sendMessage'))$('sendMessage').onclick=()=>{let inp=$('newMessage');if(inp.value.trim()){state.chat.push({side:'out',text:inp.value.trim()});$('chatInput').value=state.chat.map(m=>(m.side==='out'?'나: ':'상대: ')+m.text).join('\n');drawMessageEditor();render();$('page').scrollTop=$('page').scrollHeight}}}
function sync(){state.contact=$('contactInput').value;state.clock=$('clockInput').value||'09:41';state.notice=$('noticeInput').value;state.note=$('noteInput').value;state.mode=$('modeInput').value;render()}['contactInput','clockInput','noticeInput','noteInput','modeInput'].forEach(id=>$(id).addEventListener('input',sync));$('applyChat').onclick=()=>{state.chat=parseChat($('chatInput').value);drawMessageEditor();render()};[['lockUpload','lockImg'],['homeUpload','homeImg'],['avatarUpload','avatar'],['coverUpload','cover']].forEach(([id,key])=>$(id).onchange=async e=>{if(e.target.files[0]){state[key]=await readFile(e.target.files[0]);render()}});$('photosUpload').onchange=async e=>{state.photos.push(...await Promise.all([...e.target.files].map(readFile)));render()};$('homebar').onclick=()=>setPage('home');$('lockBtn').onclick=()=>setPage('lock');$('homeBtn').onclick=()=>setPage('home');$('messageBtn').onclick=()=>setPage('messages');$('alertsBtn').onclick=()=>setPage('alerts');$('musicBtn').onclick=()=>setPage('music');$('saveBtn').onclick=()=>{try{localStorage.setItem('iphone-studio-v1',JSON.stringify(state));alert('이 브라우저에 저장했어요.')}catch(e){alert('사진 용량이 커서 저장하지 못했습니다. 사진을 줄여 다시 시도해 주세요.')}};$('resetBtn').onclick=()=>{if(confirm('모든 편집 내용을 초기화할까요?')){localStorage.removeItem('iphone-studio-v1');location.reload()}};try{let saved=JSON.parse(localStorage.getItem('iphone-studio-v1'));if(saved){Object.assign(state,saved);$('contactInput').value=state.contact;$('clockInput').value=state.clock;$('noticeInput').value=state.notice;$('noteInput').value=state.note;$('modeInput').value=state.mode;$('chatInput').value=state.chat.map(m=>(m.side==='out'?'나: ':'상대: ')+m.text).join('\n')}}catch(e){}if(!state.chat.length)state.chat=parseChat($('chatInput').value);state.page='lock';if(!state.chat.length)state.chat=[{side:'in',text:'지금 어디야?'},{side:'out',text:'집에 있어.'},{side:'in',text:'잠깐 내려와. 보고 싶으니까.'}];
function drawMessageEditor(){const root=$('messageEditor');root.innerHTML='';state.chat.forEach((m,i)=>{let d=document.createElement('div');d.className='message-editor-row';let sel=document.createElement('select');sel.innerHTML='<option value="in">← 왼쪽 · 상대</option><option value="out">오른쪽 · 나 →</option>';sel.value=m.side;sel.onchange=()=>{m.side=sel.value;render()};let t=document.createElement('textarea');t.value=m.text;t.oninput=()=>{m.text=t.value;render()};let actions=document.createElement('div');actions.className='buttons';[['↑',()=>move(i,-1)],['↓',()=>move(i,1)],['삭제',()=>{state.chat.splice(i,1);drawMessageEditor();render()}]].forEach(([name,fn])=>{let b=document.createElement('button');b.textContent=name;b.onclick=fn;actions.appendChild(b)});d.append(sel,t,actions);root.appendChild(d)})}
function move(i,n){let j=i+n;if(j<0||j>=state.chat.length)return;[state.chat[i],state.chat[j]]=[state.chat[j],state.chat[i]];drawMessageEditor();render()}
function addMessage(side){state.chat.push({side,text:''});drawMessageEditor();render();$('messageEditor').lastElementChild?.querySelector('textarea')?.focus()}
$('addLeft').onclick=()=>addMessage('in');$('addRight').onclick=()=>addMessage('out');
['deviceInput','transparentInput','alertsInput','callsInput','songInput','artistInput'].forEach(id=>$(id).addEventListener('input',()=>{state.device=$('deviceInput').value;state.transparent=$('transparentInput').checked;state.alerts=$('alertsInput').value;state.calls=$('callsInput').value;state.song=$('songInput').value;state.artist=$('artistInput').value;render()}));
['deviceInput','transparentInput','alertsInput','callsInput','songInput','artistInput'].forEach(id=>{let k={deviceInput:'device',transparentInput:'transparent',alertsInput:'alerts',callsInput:'calls',songInput:'song',artistInput:'artist'}[id];if(state[k]!==undefined && (state[k]!=='' || id==='transparentInput')){if(id==='transparentInput')$(id).checked=!!state[k];else $(id).value=state[k]}});
state.alerts=$('alertsInput').value;state.calls=$('callsInput').value;drawMessageEditor();render();
$('exportBtn').onclick=async()=>{const status=$('exportStatus');status.textContent='PNG 이미지 생성 중…';if(typeof html2canvas!=='function'){status.textContent='이미지 저장 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';return}try{let el=$('phone');const canvas=await html2canvas(el,{backgroundColor:state.transparent?null:'#f2f2f5',scale:2,useCORS:true,logging:false});const name='iphone_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10)+'.png';canvas.toBlob(blob=>{if(!blob){status.textContent='PNG 생성에 실패했습니다.';return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);status.textContent='저장 요청 완료: '+name},'image/png')}catch(e){status.textContent='이미지 생성 실패: '+e.message}};

</script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script></body></html>
