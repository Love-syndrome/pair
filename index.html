</style></head><body><header><h1>iPhone Theme Studio <small>Rebuilt v7</small></h1><small>화면 미리보기와 PNG 저장은 동일한 Canvas를 사용합니다. 입력칸의 흐린 문구는 저장되지 않습니다.</small></header><main class="layout"><section class="panel"><div class="subhead">편집</div><div class="pair"><div><label>기종</label><select id="model"><option value="modern">최신 iPhone</option><option value="sixwhite">iPhone 6s · 화이트</option><option value="sixblack">iPhone 6s · 블랙</option></select></div><div><label>화면</label><select id="screen"><option value="lock">잠금화면</option><option value="home">홈 화면</option><option value="messages">메시지 목록</option><option value="chat">메시지 대화</option><option value="music">음악</option><option value="facetime">FaceTime</option><option value="incoming">수신 전화</option><option value="phone">최근 통화</option><option value="photos">사진</option><option value="notifications">알림</option><option value="settings">설정</option></select></div></div><div class="tabs" id="quickTabs"></div><div id="fields"></div></section><section class="previewPanel"><canvas id="phone" width="440" height="910" aria-label="아이폰 미리보기"></canvas><div id="previewCaption">사진 미등록 시 빈 화면으로 표시됩니다.</div><div class="actions"><button class="primary" id="save">PNG 저장</button><button id="transparent">바깥 배경: 투명</button></div><div class="actions"><button id="saveConfig">설정 JSON 저장</button><button id="loadConfig">설정 불러오기</button><input class="hidden" type="file" id="configFile" accept="application/json,.json"></div><p class="hint">PNG는 화면을 다시 캡처하지 않고 현재 미리보기 Canvas를 그대로 저장합니다. GIF 이미지는 업로드 가능하지만 움직이는 GIF로 내보내기는 이 버전에서 지원하지 않습니다.</p></section></main><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('phone'),ctx=canvas.getContext('2d');
const SC=3,CW=440,CH=910;canvas.width=CW*SC;canvas.height=CH*SC;

const FONT="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',Arial,sans-serif";
const S={model:'modern',screen:'lock',transparent:true,battery:64,clock:'',date:'',wallLock:null,wallHome:null,album:null,faceOther:null,faceSelf:null,callPhoto:null,photo:null,photoList:[],title:'',artist:'',duration:'',elapsed:'',musicMode:'gradient',color1:'#956781',color2:'#43283f',playing:false,showLockMusic:false,notifications:[],messages:[],contacts:[],contact:'',chatDate:'',callName:'',facetimeName:'',faceMode:'active',callMode:'incoming',photosTitle:'',settingsName:'',images:{},positions:{},volume:50,progress:30};
const IMG_KEYS=['wallLock','wallHome','album','faceOther','faceSelf','callPhoto','photo'];
const imgCache={};const photoImgs=[];let seq=0;
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function inp(k,placeholder='',type='text'){return `<label>${labels[k]||k}</label><input data-key="${k}" type="${type}" ${type==='number'?'min="0" max="100"':''} placeholder="${escapeHTML(placeholder)}" value="${escapeHTML(S[k]??'')}">`}

function pic(k,title){const pos=S.positions[k]||{x:0,y:0,z:100};return `<div class="group"><div class="subhead">${title}</div><input type="file" data-image="${k}" accept="image/*,.gif"><div class="triple"><div><label>가로</label><input type="range" min="-100" max="100" value="${pos.x}" data-pos="${k}:x"></div><div><label>세로</label><input type="range" min="-100" max="100" value="${pos.y}" data-pos="${k}:y"></div><div><label>확대</label><input type="range" min="50" max="250" value="${pos.z}" data-pos="${k}:z"></div></div><div class="actions"><button data-resetpos="${k}">위치 초기화</button><button data-clear="${k}">사진 제거</button></div></div>`}

function build(){let h=inp('battery','64','number')+inp('clock','9:41')+inp('date','10월 26일 월요일');let sc=S.screen;
if(sc==='lock')h+=pic('wallLock','잠금화면 배경')+`<label class="tog"><input type="checkbox" data-bool="showLockMusic" ${S.showLockMusic?'checked':''}> 잠금화면 음악 플레이어 표시</label>`+listEditor('notifications');
if(sc==='home')h+=pic('wallHome','홈 화면 배경');
if(sc==='messages')h+=listEditor('contacts');
if(sc==='chat')h+=inp('contact','상대방 이름')+inp('chatDate','오늘 오후 3:00')+listEditor('messages');
if(sc==='music'||sc==='lock'){h+=`<div class="group"><div class="subhead">음악</div>`+inp('title','노래 제목')+inp('artist','아티스트')+inp('elapsed','0:02')+inp('duration','5:21')+selector('musicMode',[['gradient','그라데이션'],['solid','단색']])+`<div class="pair"><div><label>배경 색상 1</label><input type="color" data-key="color1" value="${S.color1}"></div><div><label>배경 색상 2</label><input type="color" data-key="color2" value="${S.color2}"></div></div><label class="tog"><input type="checkbox" data-bool="playing" ${S.playing?'checked':''}> 재생 중 표시 (Ⅱ)</label><label>재생 진행</label><input type="range" min="0" max="100" data-key="progress" value="${S.progress}"><label>음량</label><input type="range" min="0" max="100" data-key="volume" value="${S.volume}">`+pic('album','앨범 커버')+'</div>'}
if(sc==='facetime')h+=inp('facetimeName','상대방 이름')+selector('faceMode',[['active','통화 중'],['calling','영상통화 요청 중']])+pic('faceOther','상대방 화면')+pic('faceSelf','내 화면');
if(sc==='incoming')h+=inp('callName','상대방 이름')+pic('callPhoto','수신 전화 배경');
if(sc==='phone')h+=listEditor('contacts');
if(sc==='photos')h+=inp('photosTitle','최근 항목')+pic('photo','사진')+`<label>앨범에 사진 추가</label><input type="file" id="multiPhotos" accept="image/*,.gif" multiple><button data-clearextra="1" style="margin-top:8px">추가 사진 모두 제거</button>`;
if(sc==='notifications')h+=listEditor('notifications');
if(sc==='settings')h+=inp('settingsName','사용자 이름');
$('fields').innerHTML=h;const tabs=['lock','home','messages','chat','music','facetime','incoming','phone','photos','notifications','settings'];const names=['잠금','홈','문자목록','대화','음악','FaceTime','전화수신','전화','사진','알림','설정'];$('quickTabs').innerHTML=tabs.map((t,i)=>`<button class="${t===sc?'active':''}" data-screen="${t}">${names[i]}</button>`).join('');}
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function text(s,x,y,size=16,color='#111',weight=400,align='left',max=999){if(s===''||s==null)return;ctx.font=`${weight} ${size}px ${FONT}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(String(s),x,y,max);ctx.textAlign='left'}
function line(x,y,x2,y2,color='#ddd',width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}
function drawCover(im,p,x,y,w,h,r=0){const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height;if(!iw||!ih)return false;p=p||{x:0,y:0,z:100};ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.clip();const scale=Math.max(w/iw,h/ih)*((p.z||100)/100),dw=iw*scale,dh=ih*scale;const ox=(p.x/100)*Math.max(0,dw-w)/2,oy=(p.y/100)*Math.max(0,dh-h)/2;ctx.drawImage(im,x+(w-dw)/2+ox,y+(h-dh)/2+oy,dw,dh);ctx.restore();return true}

function status(x,y,w,modern=true,dark=false){let col=dark?'#151515':'#fff';if(S.screen!=='lock'&&S.clock){if(modern)text(S.clock,x+46,y+27,17,col,650,'center');else text(S.clock,x+w/2,y+15,13,col,650,'center')}if(modern){bars(x+w-116,y+5,col);rounded(x+w-40,y+9,35,18,5,S.battery<=20?'#eb4444':S.battery>=90?'#2cc35a':'#8d8e95');text(Math.round(S.battery),x+w-23,y+18,13,'white',700,'center')}else{bars(x+w-110,y+3,col);rounded(x+w-38,y+7,32,16,4,S.battery<=20?'#ed4444':'#8d8e95');text(Math.round(S.battery),x+w-22,y+15,11,'white',700,'center')}}

if(sc==='lock'){text(S.date,x+w/2,y+116,19,'white',550,'center');text(S.clock,x+w/2,y+181,79,'white',300,'center');let yy=y+360;S.notifications.slice(0,4).forEach(n=>{if(!n.text)return;rounded(x+17,yy,w-34,68,18,'rgba(245,245,248,.38)');text(n.text,x+32,yy+34,16,'#fff',600,'left',w-64);yy+=77});if(S.showLockMusic){let by=y+h-250;rounded(x+16,by,w-32,177,22,'rgba(240,240,242,.7)');imageDraw('album',x+30,by+19,56,56,8);text(S.title,x+98,by+36,15,'#1b1b1b',650,'left',w-125);text(S.artist,x+98,by+57,12,'#444');rounded(x+33,by+100,w-66,4,2,'#9b9b9b');rounded(x+33,by+100,(w-66)*S.progress/100,4,2,'#333');text('◀◀',x+100,by+144,20,'#111',600,'center');text(S.playing?'Ⅱ':'▶',x+w/2,by+144,23,'#111',600,'center');text('▶▶',x+w-100,by+144,20,'#111',600,'center')}}
if(sc==='home'){let apps=[['#36c966','FaceTime','▣'],['#fafafa','캘린더','26'],['#f8f8f8','사진','✿'],['#555','카메라','●'],['#208aff','Mail','✉'],['#f4cd38','메모','▤'],['#fff','미리 알림','☷'],['#272727','시계','◷'],['#565656','설정','⚙']];apps.forEach((a,i)=>{let cx=x+18+(i%4)*(w-36)/4,cy=y+190+Math.floor(i/4)*103;appIcon(cx,cy,a[0],a[1],a[2])});rounded(x+15,y+h-105,w-30,88,27,'rgba(232,233,235,.55)');['☎','◉','●','♫'].forEach((a,i)=>{rounded(x+26+i*(w-52)/4,y+h-94,59,59,15,['#34c85d','#0e98ef','#35c85a','#e7496a'][i]);text(a,x+55+i*(w-52)/4,y+h-64,28,'white',600,'center')})}
if(sc==='messages'){titleHeader('메시지',x,y,w);S.contacts.forEach((c,i)=>{let yy=y+148+i*92;rounded(x+22,yy,53,53,27,'#a7abb5');text((c.text||'').slice(0,1),x+49,yy+27,22,'#fff',600,'center');text(c.text,x+92,yy+18,19,'#111',650,'left',w-116);line(x+91,yy+69,x+w-12,yy+69,'#e6e6e6')})}
if(sc==='chat'){rounded(x,y+44,w,100,0,'#fafafa');text('‹',x+16,y+100,42,'#1687fa');rounded(x+w/2-22,y+57,44,44,22,'#a6aab2');text(S.contact.slice(0,1),x+w/2,y+79,20,'#fff',600,'center');text(S.contact,x+w/2,y+120,14,'#111',600,'center');text(S.chatDate,x+w/2,y+169,13,'#9b9ba2',400,'center');let yy=y+201;const maxTW=w-72-32;ctx.font=`400 15px ${FONT}`;S.messages.forEach(m=>{if(!m.text)return;let right=m.side==='right';let lines=[];String(m.text).split('\n').forEach(par=>{let cur='';for(const ch of Array.from(par)){if(ctx.measureText(cur+ch).width>maxTW&&cur){lines.push(cur);cur=ch}else cur+=ch}lines.push(cur)});let tw=Math.max(...lines.map(t=>ctx.measureText(t).width)),mw=Math.max(46,Math.ceil(tw)+32),mh=Math.max(40,lines.length*22+18),mx=right?x+w-mw-14:x+14;rounded(mx,yy,mw,mh,19,right?'#1789ff':'#e9e9eb');lines.forEach((t,i)=>text(t,mx+16,yy+9+11+i*22,15,right?'white':'#111'));yy+=mh+10});rounded(x+18,y+h-73,w-36,44,22,'#f7f7f7','#d6d6d6')}
if(sc==='music'){let aW=w-76,aY=y+125;placeholderImage(x+38,aY,aW,aW);imageDraw('album',x+38,aY,aW,aW,12);let ty=aY+aW+42;text(S.title,x+34,ty,23,'white',700,'left',w-68);text(S.artist,x+34,ty+31,17,'rgba(255,255,255,.75)',450,'left',w-68);let py=ty+101;rounded(x+34,py,w-68,5,3,'rgba(255,255,255,.36)');rounded(x+34,py,(w-68)*S.progress/100,5,3,'#fff');text(S.elapsed,x+34,py+25,13,'rgba(255,255,255,.7)');text(S.duration?'-'+S.duration:'',x+w-34,py+25,13,'rgba(255,255,255,.7)',400,'right');let cy=py+125;text('◀◀',x+91,cy,29,'white',600,'center');text(S.playing?'Ⅱ':'▶',x+w/2,cy,39,'white',600,'center');text('▶▶',x+w-91,cy,29,'white',600,'center');rounded(x+40,cy+103,w-80,6,4,'rgba(255,255,255,.32)');rounded(x+40,cy+103,(w-80)*S.volume/100,6,4,'rgba(255,255,255,.9)');text('◉',x+w/2,y+h-53,23,'#fff',400,'center')}
if(sc==='facetime'){imageDraw('faceOther',x,y,w,h);if(S.faceMode==='calling'){text(S.facetimeName,x+w/2,y+155,34,'white',650,'center');text('영상통화 요청 중…',x+w/2,y+198,20,'white',400,'center')}else{rounded(x+w-128,y+66,108,165,12,'#666');imageDraw('faceSelf',x+w-128,y+66,108,165,12)}let cy=y+h-96;[['↻',x+w*.24,'#747474'],['☎',x+w*.5,'#f13636'],['♩',x+w*.76,'#747474']].forEach(([s,c,col])=>{rounded(c-30,cy-30,60,60,30,col);text(s,c,cy,29,'white',650,'center')})}
if(sc==='incoming'){ctx.fillStyle='rgba(0,0,0,.37)';ctx.fillRect(x,y,w,h);text(S.callName,x+w/2,y+170,39,'white',700,'center');text('영상통화 요청 중…',x+w/2,y+222,21,'white',400,'center');text('나중에 보기',x+93,y+h-240,15,'white',400,'center');text('메시지',x+w-93,y+h-240,15,'white',400,'center');[['✕',x+w*.26,'#f73539','거절'],['▣',x+w*.74,'#29cc53','응답']].forEach(([s,c,col,t])=>{rounded(c-40,y+h-183,80,80,40,col);text(s,c,y+h-143,35,'white',600,'center');text(t,c,y+h-80,16,'white',500,'center')})}
if(sc==='phone'){titleHeader('최근 통화',x,y,w);S.contacts.forEach((c,i)=>{let yy=y+150+i*68;text(c.text,x+24,yy,18,'#111',600);text('ⓘ',x+w-30,yy,21,'#1687ff');line(x+22,yy+37,x+w-20,yy+37,'#e8e8e8')})}
if(sc==='photos'){titleHeader(S.photosTitle||'사진',x,y,w);let gy=y+150;if(imgCache.photo){imageDraw('photo',x+18,gy,w-36,w-36,9);gy+=w-36+10}const cell=(w-36-6)/3;photoImgs.forEach((im,i)=>{drawCover(im,null,x+18+(i%3)*(cell+3),gy+Math.floor(i/3)*(cell+3),cell,cell,4)})}
if(sc==='notifications'){titleHeader('알림',x,y,w);S.notifications.forEach((n,i)=>{if(!n.text)return;rounded(x+15,y+150+i*88,w-30,73,15,'#f0f0f3');text(n.text,x+30,y+187+i*88,16,'#222',550,'left',w-60)})}
if(sc==='settings'){titleHeader('설정',x,y,w);rounded(x+15,y+151,w-30,83,15,'#f3f3f5');text(S.settingsName,x+93,y+193,20,'#111',650);['Wi-Fi','Bluetooth','알림','배경화면','디스플레이 및 밝기','배터리'].forEach((s,i)=>{let yy=y+267+i*62;text(s,x+30,yy,17,'#222');text('›',x+w-30,yy,25,'#aaa');line(x+20,yy+30,x+w-20,yy+30,'#ececec')})}
if(modern)rounded(x+w/2-56,y+12,112,30,18,'#000');
if(modern)rounded(x+w/2-53,y+h-16,106,5,4,bgDark?'#fff':'#111');ctx.restore()}
function draw(){let modern=S.model==='modern',W=CW,H=CH;ctx.setTransform(SC,0,0,SC,0,0);ctx.clearRect(0,0,W,H);if(!S.transparent){ctx.fillStyle='#f3f4f7';ctx.fillRect(0,0,W,H)}let fx=modern?14:26,fy=modern?9:8,fw=modern?412:388,fh=modern?892:895;rounded(fx,fy,fw,fh,modern?58:52,modern?'#202125':S.model==='sixwhite'?'#d5d5d5':'#202023');rounded(fx+7,fy+7,fw-14,fh-14,modern?51:46,modern?'#0c0d0e':S.model==='sixwhite'?'#f5f5f5':'#090909');let sx=modern?fx+12:fx+21,sy=modern?fy+12:fy+105,sw=modern?fw-24:fw-42,sh=modern?fh-24:fh-211;drawScreen(sx,sy,sw,sh);if(!modern){rounded(fx+fw/2-23,fy+fh-75,46,46,24,S.model==='sixwhite'?'#ededed':'#171717',S.model==='sixwhite'?'#aaa':'#494949');rounded(fx+fw/2-15,fy+fh-67,30,30,17,null,S.model==='sixwhite'?'#ccc':'#4b4b4b');rounded(fx+fw/2-22,fy+52,44,6,4,S.model==='sixwhite'?'#6c6c6c':'#343434');rounded(fx+fw/2-62,fy+50,7,7,4,S.model==='sixwhite'?'#555':'#252525')}}
function render(){build();draw()}
$('model').onchange=e=>{S.model=e.target.value;render()};$('screen').onchange=e=>{S.screen=e.target.value;render()};
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.key){let k=t.dataset.key;S[k]=['battery','progress','volume'].includes(k)?Math.min(100,Math.max(0,Number(t.value)||0)):t.value;draw()}if(t.dataset.pos){let [k,dim]=t.dataset.pos.split(':');(S.positions[k]??={x:0,y:0,z:100})[dim]=Number(t.value);draw()}if(t.dataset.item){let [type,i,k]=t.dataset.item.split(':');S[type][+i][k]=t.value;draw()}});
function loadImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);res(im)};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'))};im.src=url})}
function syncSliders(k){const p=S.positions[k]||{x:0,y:0,z:100};document.querySelectorAll(`[data-pos^="${k}:"]`).forEach(el=>{el.value=p[el.dataset.pos.split(':')[1]]})}
document.addEventListener('change',async e=>{let t=e.target;if(t.dataset.bool){S[t.dataset.bool]=t.checked;draw()}
if(t.dataset.image){const f=t.files&&t.files[0];if(!f)return;try{imgCache[t.dataset.image]=await loadImg(f);S.positions[t.dataset.image]={x:0,y:0,z:100};syncSliders(t.dataset.image);draw()}catch(err){alert('이미지를 불러오지 못했습니다.')}}
if(t.id==='multiPhotos'){const files=Array.from(t.files||[]);for(const f of files){try{photoImgs.push(await loadImg(f))}catch(err){}}t.value='';draw()}});
document.addEventListener('click',e=>{const t=e.target;if(t.dataset.screen){S.screen=t.dataset.screen;$('screen').value=S.screen;render()}if(t.dataset.add){let type=t.dataset.add;S[type].push(type==='messages'?{side:'left',text:''}:{text:''});render()}if(t.dataset.del){let [type,i]=t.dataset.del.split(':');S[type].splice(+i,1);render()}if(t.dataset.move){let [type,i,d]=t.dataset.move.split(':'),a=S[type],j=+i+(+d);if(j>=0&&j<a.length)[a[i],a[j]]=[a[j],a[i]];render()}if(t.dataset.clear){delete imgCache[t.dataset.clear];S.positions[t.dataset.clear]={x:0,y:0,z:100};render()}if(t.dataset.resetpos){S.positions[t.dataset.resetpos]={x:0,y:0,z:100};syncSliders(t.dataset.resetpos);draw()}if(t.dataset.clearextra){photoImgs.length=0;draw()}});
function filename(ext){return 'iphone_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10)+'.'+ext}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},1500)}
$('save').onclick=()=>{draw();canvas.toBlob(b=>{if(!b)return alert('PNG 생성에 실패했습니다.');download(b,filename('png'))},'image/png')};$('transparent').onclick=()=>{S.transparent=!S.transparent;$('transparent').textContent='바깥 배경: '+(S.transparent?'투명':'흰색');draw()};
$('saveConfig').onclick=()=>{const out={...S,images:{}};download(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),filename('json'))};$('loadConfig').onclick=()=>$('configFile').click();$('configFile').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());for(const k of Object.keys(S)){if(k!=='images'&&Object.hasOwn(obj,k))S[k]=obj[k]}for(const k of ['notifications','messages','contacts']){if(!Array.isArray(S[k]))S[k]=[]}if(!S.positions||typeof S.positions!=='object')S.positions={};e.target.value='';$('model').value=S.model;$('screen').value=S.screen;render()}catch(err){alert('설정 파일을 읽지 못했습니다.')}};
render();
</script></body></html>
